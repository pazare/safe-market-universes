[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-market-universes"
version = "0.1.0"
description = "Benchmark for calibrated deferral and finite-budget oversight in long-horizon financial recommendation agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Pablo Zavala" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langgraph==1.1.6",
  "openai==2.31.0",
  "yfinance==1.2.1",
  "pandas==3.0.2",
  "numpy==2.4.4",
  "python-dotenv==1.2.2",
  "pydantic==2.12.5",
  "gymnasium==1.2.2",
  "matplotlib==3.10.7",
  "markdown-it-py==4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
]
wrds = [
  "wrds>=3.3.0",
]

[project.scripts]
smu = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
