name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Reproduce flagship results from committed logs (no model calls)
        run: python scripts/export_oversight_allocation.py
      - name: Check README numbers against the committed run artifacts
        run: python scripts/check_report_consistency.py
      - name: Assert regenerated text artifacts are byte-identical to committed logs
        run: git diff --exit-code -- report/oversight_allocation_results.md report/oversight_allocation_results.json
